<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elf AR Experience</title>
  
  <!-- A-Frame and MindAR Libraries -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }

    #ui-container {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      gap: 12px;
    }

    .ar-btn {
      padding: 14px 24px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background-color: #008cba;
      border: none;
      border-radius: 30px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- MODE 1: CARD TRACKING -->
  <div id="card-mode">
    <a-scene mindar-image="imageTargetSrc: ./card-target.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <a-asset-item id="elf" src="elf-model.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model 
          src="#elf" 
          position="0 0 0" 
          scale="0.5 0.5 0.5" 
          rotation="90 0 0"
          animation-mixer="clip: *; loop: repeat">
        </a-gltf-model>
      </a-entity>
    </a-scene>
  </div>

  <!-- MODE 2: SQUARE BOUNDARY WALK -->
  <div id="floor-mode" style="display: none;">
    <a-scene webxr="optionalFeatures: hit-test" embedded>
      <a-assets>
        <a-asset-item id="elf-floor" src="elf-model.glb"></a-asset-item>
      </a-assets>

      <a-entity id="reticle" ar-hit-test visible="false">
        <a-ring rotation="-90 0 0" radius-inner="0.08" radius-outer="0.12" color="#00FF00"></a-ring>
      </a-entity>

      <a-box id="square-boundary" position="0 0 0" width="2" height="0.01" depth="2" material="color: #00FF00; wireframe: true" visible="false"></a-box>

      <a-gltf-model 
        id="elf-walker"
        src="#elf-floor" 
        scale="0.3 0.3 0.3" 
        visible="false"
        animation-mixer="clip: *; loop: repeat">
      </a-gltf-model>

      <a-entity camera></a-entity>
    </a-scene>
  </div>

  <!-- UI BUTTONS -->
  <div id="ui-container">
    <button id="mic-btn" class="ar-btn">🎙️ Talk to Elf</button>
    <button id="mode-btn" class="ar-btn">📦 Switch to Square Walk</button>
  </div>

  <!-- JAVASCRIPT CODE INCLUDED DIRECTLY HERE -->
  <script>
    let mode = 'card';
    const modeBtn = document.getElementById('mode-btn');
    const cardMode = document.getElementById('card-mode');
    const floorMode = document.getElementById('floor-mode');

    const reticle = document.getElementById('reticle');
    const elfWalker = document.getElementById('elf-walker');
    const boundaryBox = document.getElementById('square-boundary');

    let isPlaced = false;
    let squareCenter = { x: 0, z: 0 };
    const HALF_SIZE = 0.9;

    // Mode Toggle Logic
    modeBtn.addEventListener('click', () => {
      if (mode === 'card') {
        mode = 'floor';
        cardMode.style.display = 'none';
        floorMode.style.display = 'block';
        modeBtn.textContent = '🃏 Switch to Card Mode';
      } else {
        mode = 'card';
        floorMode.style.display = 'none';
        cardMode.style.display = 'block';
        modeBtn.textContent = '📦 Switch to Square Walk';
      }
    });

    // Floor Detection Logic
    const floorScene = floorMode.querySelector('a-scene');
    floorScene.addEventListener('click', () => {
      if (mode === 'floor' && !isPlaced && reticle && reticle.getAttribute('visible')) {
        const pos = reticle.getAttribute('position');

        elfWalker.setAttribute('position', pos);
        elfWalker.setAttribute('visible', 'true');

        boundaryBox.setAttribute('position', `${pos.x} ${pos.y + 0.01} ${pos.z}`);
        boundaryBox.setAttribute('visible', 'true');

        squareCenter = { x: pos.x, z: pos.z, y: pos.y };
        isPlaced = true;

        startSquareWalk();
      }
    });

    function getNextSquareWaypoint() {
      const randomX = squareCenter.x + (Math.random() * (HALF_SIZE * 2) - HALF_SIZE);
      const randomZ = squareCenter.z + (Math.random() * (HALF_SIZE * 2) - HALF_SIZE);
      return { x: randomX, z: randomZ };
    }

    function startSquareWalk() {
      setInterval(() => {
        if (!isPlaced || mode !== 'floor') return;

        const currentPos = elfWalker.getAttribute('position');
        const target = getNextSquareWaypoint();

        const dx = target.x - currentPos.x;
        const dz = target.z - currentPos.z;
        const angleY = (Math.atan2(dx, dz) * 180) / Math.PI;

        elfWalker.setAttribute('rotation', `0 ${angleY} 0`);

        elfWalker.setAttribute('animation', {
          property: 'position',
          to: `${target.x} ${squareCenter.y} ${target.z}`,
          dur: 3500,
          easing: 'linear'
        });
      }, 4500);
    }
  </script>
</body>
</html>
