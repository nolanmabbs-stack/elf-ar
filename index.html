<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elf AR Experience</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    
    /* Red dot indicator in top-left to confirm code update */
    #status-dot {
      position: absolute;
      top: 15px;
      left: 15px;
      width: 16px;
      height: 16px;
      background-color: #ff0000;
      border-radius: 50%;
      border: 2px solid white;
      z-index: 1000;
      box-shadow: 0 0 6px rgba(0,0,0,0.4);
    }

    #mic-btn {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background-color: #008cba;
      border: none;
      border-radius: 50px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Status indicator dot -->
  <div id="status-dot"></div>

  <button id="mic-btn">🎙️ Talk to Elf</button>

  <a-scene 
    mindar-image="imageTargetSrc: ./card-target.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item id="elf" src="./elf-model.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model 
        src="#elf" 
        position="0 0 0" 
        scale="0.5 0.5 0.5" 
        rotation="0 0 0" 
        animation-mixer="clip: *; loop: repeat">
      </a-gltf-model>
    </a-entity>

  </a-scene>

  <script>
    const micBtn = document.getElementById('mic-btn');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    // Load web speech voices for mobile devices
    let voices = [];
    function loadVoices() {
      voices = window.speechSynthesis.getVoices();
    }
    loadVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = loadVoices;
    }

    function speakElf(text) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.pitch = 1.8; // High elf pitch
      utterance.rate = 1.25;  // Energetic speed

      if (voices.length > 0) {
        const preferredVoice = voices.find(v => v.lang.startsWith('en') && !v.name.includes('Compact'));
        if (preferredVoice) utterance.voice = preferredVoice;
      }

      window.speechSynthesis.speak(utterance);
    }

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';

      recognition.onstart = () => { 
        micBtn.innerText = 'Listening...'; 
      };
      
      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        micBtn.innerText = '🎙️ Talk to Elf';

        let reply = "Fascinating observation! You mentioned: " + text;
        const lowerText = text.toLowerCase();

        if (lowerText.includes('hello') || lowerText.includes('hi')) {
          reply = "Greetings! I'm hard at work running complex magic calculations. What's on your mind?";
        } else if (lowerText.includes('who are you') || lowerText.includes('name')) {
          reply = "I'm the resident North Pole engineer! Part magic, part high-tech ingenuity.";
        } else if (lowerText.includes('magic') || lowerText.includes('spell')) {
          reply = "Magic isn't just mystery, my friend—it's advanced quantum mechanics wrapped in holiday cheer!";
        }

        speakElf(reply);
      };

      recognition.onerror = () => { 
        micBtn.innerText = '🎙️ Talk to Elf';
      };

      micBtn.addEventListener('click', () => { 
        speakElf(""); // Unlocks speech audio context on mobile tap
        recognition.start(); 
      });
    } else {
      micBtn.innerText = 'Voice API Not Supported';
    }
  </script>
</body>
</html>
