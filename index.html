<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elf AR Experience</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }

    #mic-btn {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background-color: #008cba;
      border: none;
      border-radius: 50px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <button id="mic-btn">🎙️ Talk to Elf</button>

  <a-scene 
    mindar-image="imageTargetSrc: ./card-target.mind; autoStart: true; uiLoading: no; uiError: no;" 
    color-space="sRGB" 
    renderer="colorManagement: true; physicallyCorrectLights: false; exposure: 1.0;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item id="elf" src="./elf-model.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Balanced lighting setup so the model textures render with full color -->
    <a-light type="ambient" color="#ffffff" intensity="1.2"></a-light>
    <a-light type="directional" color="#ffffff" intensity="0.8" position="1 4 3"></a-light>
    <a-light type="directional" color="#ffffff" intensity="0.4" position="-1 -2 2"></a-light>

    <a-entity mindar-image-target="targetIndex: 0">
      <!-- Rotation 0 0 0 sets the model standing straight up on a flat desk target -->
      <a-gltf-model 
        src="#elf" 
        position="0 0 0" 
        scale="0.5 0.5 0.5" 
        rotation="90 0 90"
        animation-mixer="clip: *; loop: repeat">
      </a-gltf-model>
    </a-entity>

  </a-scene>

  <script>
    const micBtn = document.getElementById('mic-btn');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    let isListening = false;
    let voices = [];

    function loadVoices() {
      voices = window.speechSynthesis.getVoices();
    }
    loadVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = loadVoices;
    }

    function speakElf(text) {
      window.speechSynthesis.cancel();
      if (!text) return;

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.pitch = 1.5;
      utterance.rate = 1.0;

      if (voices.length > 0) {
        const preferredVoice = voices.find(v => v.lang.includes('en')) || voices[0];
        if (preferredVoice) utterance.voice = preferredVoice;
      }

      window.speechSynthesis.speak(utterance);
    }

    function getSmartElfResponse(question) {
      const q = question.toLowerCase();

      if (q.includes('hello') || q.includes('hi') || q.includes('hey')) {
        return "Hello there! Nice to meet you!";
      }
      if (q.includes('who are you') || q.includes('name')) {
        return "I am your desk elf! Ready for action.";
      }
      if (q.includes('santa') || q.includes('christmas')) {
        return "Santa's workshop is super busy right now!";
      }
      
      return "That's awesome! Tell me more about " + question + "!";
    }

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';

      recognition.onstart = () => { 
        isListening = true;
        micBtn.innerText = 'Listening...'; 
      };
      
      recognition.onresult = (event) => {
        isListening = false;
        const text = event.results[0][0].transcript;
        micBtn.innerText = '🎙️ Talk to Elf';

        const reply = getSmartElfResponse(text);
        speakElf(reply);
      };

      recognition.onerror = () => { 
        isListening = false;
        micBtn.innerText = '🎙️ Talk to Elf';
      };

      recognition.onend = () => {
        isListening = false;
        micBtn.innerText = '🎙️ Talk to Elf';
      };

      micBtn.addEventListener('click', () => { 
        // Unlocks mobile browser audio on tap
        const unlockAudio = new SpeechSynthesisUtterance('');
        window.speechSynthesis.speak(unlockAudio);

        if (!isListening) {
          try {
            recognition.start();
          } catch (e) {
            console.log("Error starting voice:", e);
          }
        }
      });
    } else {
      micBtn.innerText = 'Voice Not Supported on Browser';
    }
  </script>
</body>
</html>
