<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elf AR Experience</title>
  
  <!-- A-Frame and MindAR Libraries -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }

    #ui-container {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      gap: 12px;
    }

    .ar-btn {
      padding: 14px 24px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background-color: #008cba;
      border: none;
      border-radius: 30px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <a-scene mindar-image="imageTargetSrc: ./card-target.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-assets>
      <a-asset-item id="elf" src="elf-model.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      
      <!-- Boundary Wireframe Box -->
      <a-box id="boundary-box" position="0 0 0" width="1.5" height="0.01" depth="1.5" material="color: #00FF00; wireframe: true" visible="false"></a-box>

      <!-- Parent Wrapper to handle Position and Rotation -->
      <a-entity id="elf-container" position="0 0 0" rotation="0 0 0">
        
        <!-- Child Elf Model locked in upright posture -->
        <a-gltf-model 
          id="elf-model"
          src="#elf" 
          position="0 0 0" 
          scale="0.5 0.5 0.5" 
          rotation="90 0 0"
          animation-mixer="clip: *; loop: repeat">
        </a-gltf-model>

      </a-entity>

    </a-entity>
  </a-scene>

  <div id="ui-container">
    <button id="mic-btn" class="ar-btn">🎙️ Talk to Elf</button>
    <button id="mode-btn" class="ar-btn">📦 Start Boundary Walk</button>
  </div>

  <script>
    let isWalking = false;
    let walkInterval = null;
    const modeBtn = document.getElementById('mode-btn');
    const container = document.getElementById('elf-container');
    const boundaryBox = document.getElementById('boundary-box');

    modeBtn.addEventListener('click', () => {
      isWalking = !isWalking;

      if (isWalking) {
        boundaryBox.setAttribute('visible', 'true');
        modeBtn.textContent = '🃏 Return to Center';
        startBoundaryWandering();
      } else {
        stopBoundaryWandering();
      }
    });

    function stopBoundaryWandering() {
      isWalking = false;
      if (walkInterval) {
        clearInterval(walkInterval);
        walkInterval = null;
      }

      // Clear all active movement and rotation animations
      container.removeAttribute('animation');
      container.removeAttribute('animation__rotate');

      boundaryBox.setAttribute('visible', 'false');
      modeBtn.textContent = '📦 Start Boundary Walk';

      // Snap container back to standing center position facing forward
      container.setAttribute('position', '0 0 0');
      container.setAttribute('rotation', '0 0 0');
    }

    function startBoundaryWandering() {
      walkNextStep();
      walkInterval = setInterval(() => {
        if (!isWalking) return;
        walkNextStep();
      }, 4000);
    }

    function walkNextStep() {
      if (!isWalking) return;

      const currentPos = container.getAttribute('position') || { x: 0, y: 0, z: 0 };
      
      // Target coordinates inside boundary box
      const targetX = (Math.random() * 1.0) - 0.5;
      const targetY = (Math.random() * 1.0) - 0.5;

      const dx = targetX - currentPos.x;
      const dy = targetY - currentPos.y;

      // Calculate direction angle across the card plane
      const angleRad = Math.atan2(dy, dx);
      let angleDeg = (angleRad * 180) / Math.PI;

      // Turn parent container to face forward (-90 degrees offset)
      container.setAttribute('animation__rotate', {
        property: 'rotation',
        to: `0 0 ${angleDeg - 90}`,
        dur: 400,
        easing: 'easeOutQuad'
      });

      // Move parent container smoothly across the card
      container.setAttribute('animation', {
        property: 'position',
        to: `${targetX} ${targetY} 0`,
        dur: 3000,
        easing: 'linear'
      });
    }
  </script>
</body>
</html>
