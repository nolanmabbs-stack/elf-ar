<script>
    let isWalking = false;
    let walkInterval = null;
    const modeBtn = document.getElementById('mode-btn');
    const elf = document.getElementById('elf-model');
    const boundaryBox = document.getElementById('boundary-box');

    // Toggle Boundary Walk Mode
    modeBtn.addEventListener('click', () => {
      isWalking = !isWalking;

      if (isWalking) {
        boundaryBox.setAttribute('visible', 'true');
        modeBtn.textContent = '🃏 Return to Center';
        startBoundaryWandering();
      } else {
        stopBoundaryWandering();
      }
    });

    function stopBoundaryWandering() {
      isWalking = false;
      clearInterval(walkInterval);
      walkInterval = null;

      // Remove any active position/rotation animation components to prevent glitching
      elf.removeAttribute('animation');
      elf.removeAttribute('animation__rotate');

      boundaryBox.setAttribute('visible', 'false');
      modeBtn.textContent = '📦 Start Boundary Walk';

      // Snap cleanly back to center standing position
      elf.setAttribute('position', '0 0 0');
      elf.setAttribute('rotation', '0 0 90');
    }

    function startBoundaryWandering() {
      // Run first step immediately
      walkNextStep();

      // Repeat movement loop
      walkInterval = setInterval(() => {
        if (!isWalking) return;
        walkNextStep();
      }, 4000);
    }

    function walkNextStep() {
      const currentPos = elf.getAttribute('position');
      
      // Random target coordinates inside boundary box
      const targetX = (Math.random() * 1.0) - 0.5;
      const targetY = (Math.random() * 1.0) - 0.5;

      const dx = targetX - currentPos.x;
      const dy = targetY - currentPos.y;

      // Calculate 2D direction angle on card plane
      const angleRad = Math.atan2(dy, dx);
      let angleDeg = (angleRad * 180) / Math.PI;

      // Turn model smoothly toward destination along Z-axis while preserving standing tilt
      elf.setAttribute('animation__rotate', {
        property: 'rotation',
        to: `0 0 ${angleDeg + 90}`,
        dur: 500,
        easing: 'easeOutQuad'
      });

      // Move smoothly to target location
      elf.setAttribute('animation', {
        property: 'position',
        to: `${targetX} ${targetY} 0`,
        dur: 3000,
        easing: 'linear'
      });
    }
  </script>
